server:
  port: ${SERVER_PORT:8386}
spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: filmlink-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/filmlink}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_schema: ${DB_SCHEMA:filmlink_local}
  flyway:
    enabled: true
    schemas: ${DB_SCHEMA:filmlink_local}
    default-schema: ${DB_SCHEMA:filmlink_local}
    create-schemas: true
  mvc:
    problemdetails:
      enabled: true

springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:true}
    path: /v3/api-docs
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}
    path: /swagger-ui.html
jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:86400000}